name: Deployment Exercise 1
on: push
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          browser: chrome
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Upload test report artifact
        if: always() # Ensure this step runs even if tests fail
        uses: actions/upload-artifact@v3
        with:
          name: mochawesome-report
          path: /home/runner/work/RoboFiends/RoboFiends/cypress/reports/html/index.html

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Build code
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Get build artifact
        uses: actions/download-artifact@v3
        with:
          name: build
          path: ./build
      - name: Output contents
        run: ls

      - name: Deploy code
        id: deploy
        uses: ./.github/actions/deploy-s3-javascript
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          bucket: ala123ghactions
          build-folder: ./build
      - name: Output information
        id: output-url
        run: |
          echo "Live URL: ${{ steps.deploy.outputs.website-url }}"
  lighthouse:
    runs-on: ubuntu-latest
    needs: deploy # Ensure Lighthouse runs after the test
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Audit URLs using Lighthouse (mobile)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://ala123ghactions.s3-website-us-east-1.amazonaws.com
          uploadArtifacts: true # save results as an action artifacts
          temporaryPublicStorage: true # upload lighthouse report to the temporary storage
          configPath: /.lighthouse/mobile-config.js

      - name: Audit URLs using Lighthouse (desktop)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://ala123ghactions.s3-website-us-east-1.amazonaws.com
          uploadArtifacts: true # save results as an action artifacts
          temporaryPublicStorage: true # upload lighthouse report to the temporary storage
          configPath: /.lighthouse/desktop-config.js
