name: Deployment Exercise 1
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Start the app
        run: npm start &

      - name: Wait for the app to be ready
        run: npx wait-on http://localhost:3000 && echo "App is ready"

      - name: Test code
        run: npm run test

      - name: Build code
        run: npm run build

      - name: Deploy code
        run: echo "Deploying..."
