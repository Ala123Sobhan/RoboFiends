version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - yarn run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
test:
  phases:
    preTest:
      commands:
        - yarn global add wait-on
        - yarn global add pm2
        - export PATH="$(yarn global bin):$PATH"
        - yarn global add mocha mochawesome
        - pm2 start npm -- start
        - "wait-on http://localhost:8000"
    test:
      commands:
        - yarn cypress run
    postTest:
      commands:
        - pm2 kill
  artifacts:
    baseDirectory: cypress
    configFilePath: "**/mochawesome.json"
    files:
      - "**/*.json"
      - "**/*.png"
      - "**/*.mp4"
