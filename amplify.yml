version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
test:
  artifacts:
    baseDirectory: cypress
    configFilePath: "**/mochawesome.json"
    files:
      - "**/*.json"
      - "**/*.png"
      - "**/*.mp4"
  phases:
    preTest:
      commands:
        - npm install
        - npm install wait-on
        - npm install pm2
        - npm install mocha mochawesome mochawesome-merge mochawesome-report-generator
        - npx pm2 start npm -- start
        - "npx wait-on http://localhost:3000"
    test:
      commands:
        - npx cypress install
        - 'npx cypress run --reporter mochawesome --reporter-options "reportDir=cypress/mochawesome-report,overwrite=false,html=false,json=true,timestamp=mmddyyyy_HHMMss"'
        # - npx cypress run test --record --key 207ca353-1e88-4962-ae60-a7d18d659a1b
    postTest:
      commands:
        - npx mochawesome-merge cypress/mochawesome-report/mochawesome*.json > cypress/mochawesome.json
        - npx pm2 kill
