version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - yarn run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
test:
  phases:
    preTest:
      commands:
        - yarn global add wait-on
        - yarn global add pm2
        - yarn global add mocha mochawesome mochawesome-merge mochawesome-report-generator
        - pm2 start npm -- start
        - "wait-on http://localhost:8000"
    test:
      commands:
        - yarn cypress run
        - yarn cypress run --reporter mochawesome --reporter-options "reportDir=cypress/mochawesome-report,overwrite=false,html=false,json=true,timestamp=mmddyyyy_HHMMss"
    postTest:
      commands:
        - yarn run --silent mochawesome-merge cypress/mochawesome-report/mochawesome*.json > cypress/mochawesome.json
        - pm2 kill
  artifacts:
    baseDirectory: cypress
    configFilePath: "**/mochawesome.json"
    files:
      - "**/*.json"
      - "**/*.png"
      - "**/*.mp4"
